<script>
    // On-screen debug logger for mobile troubleshooting
    window.addEventListener('error', function(event) {
        let errDiv = document.getElementById('debug-overlay');
        if (!errDiv) {
            errDiv = document.createElement('div');
            errDiv.id = 'debug-overlay';
            errDiv.style.cssText = 'position:fixed;bottom:0;left:0;width:100%;max-height:50%;background:rgba(255,0,0,0.85);color:white;padding:10px;font-size:12px;overflow:auto;z-index:99999;word-break:break-all;';
            document.body.appendChild(errDiv);
        }
        errDiv.innerHTML += `<br>[Error] ${event.message} (${event.filename}:${event.lineno})<br>`;
    });

    const RenPyPlayer = {
        extractedFiles: {},
        
        init() {
            const fileInput = document.getElementById('file-input');
            if (!fileInput) {
                console.error("file-input element not found!");
                return;
            }
            fileInput.addEventListener('change', (e) => this.handleZipSelect(e));
        },

        async handleZipSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            this.updateLoaderStatus(`Reading ${file.name}...`);
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                
                this.updateLoaderStatus("Unpacking game files...");
                const zip = await JSZip.loadAsync(arrayBuffer);
                
                this.extractedFiles = {};
                const filePromises = [];

                zip.forEach((relativePath, zipEntry) => {
                    if (!zipEntry.dir) {
                        const promise = zipEntry.async('uint8array').then((content) => {
                            this.extractedFiles[relativePath] = content;
                        });
                        filePromises.push(promise);
                    }
                });

                await Promise.all(filePromises);
                
                this.updateLoaderStatus("Mounting to Virtual File System...");
                await this.mountToVirtualFS();

            } catch (error) {
                console.error("Failed to load game zip:", error);
                alert("Error unpacking zip file. Please ensure it's a valid Ren'Py export.");
                this.resetUI();
            }
        },

        async mountToVirtualFS() {
            for (const [filePath, data] of Object.entries(this.extractedFiles)) {
                const targetPath = `/game/${filePath}`;
                this.ensureDirExists(targetPath);
                
                if (typeof FS !== 'undefined') {
                    FS.writeFile(targetPath, data);
                }
            }

            this.updateLoaderStatus("Starting Ren'Py...");
            
            document.getElementById('loader-screen').style.display = 'none';
            document.getElementById('canvas-container').style.display = 'block';

            if (typeof Module !== 'undefined' && Module.callMain) {
                Module.callMain(['/game']);
            }
        },

        ensureDirExists(filePath) {
            if (typeof FS === 'undefined') return;
            const parts = filePath.split('/').slice(0, -1);
            let currentPath = '';
            for (const part of parts) {
                if (!part) continue;
                currentPath += '/' + part;
                try {
                    FS.mkdir(currentPath);
                } catch (e) {
                    // Directory already exists
                }
            }
        },

        updateLoaderStatus(message) {
            const statusElem = document.querySelector('#loader-screen p');
            if (statusElem) statusElem.textContent = message;
        },

        resetUI() {
            document.getElementById('loader-screen').style.display = 'flex';
            document.getElementById('canvas-container').style.display = 'none';
            this.updateLoaderStatus("Select a compiled PC game zip archive (.zip) to load and play directly in your browser.");
        }
    };

    // Safely initialize once the HTML document structure is fully loaded
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => RenPyPlayer.init());
    } else {
        RenPyPlayer.init();
    }

    // Register Service Worker for offline PWA support
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then((reg) => console.log('Service Worker registered!', reg))
                .catch((err) => console.log('Service Worker registration failed:', err));
        });
    }
</script>
