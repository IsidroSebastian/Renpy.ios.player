<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ren'Py Web Player for iOS</title>
    
    <!-- PWA Meta Tags for iOS -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ren'Py Player">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: fixed;
        }
        #app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #loader-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            width: 100%;
            height: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        p {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 24px;
            max-width: 300px;
            line-height: 1.4;
        }
        .upload-btn {
            background-color: #007aff;
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }
        .upload-btn:active {
            opacity: 0.8;
        }
        #file-input {
            display: none;
        }
        #canvas-container {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
    </style>
    <!-- Include JSZip library from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

    <div id="app-container">
        <!-- Initial Game Loader Screen -->
        <div id="loader-screen">
            <h1>Ren'Py iOS Runner</h1>
            <p>Select a compiled PC game zip archive (.zip) to load and play directly in your browser.</p>
            <button class="upload-btn" onclick="document.getElementById('file-input').click();">Select Game Zip</button>
            <input type="file" id="file-input" accept=".zip">
        </div>

        <!-- Engine Viewport Container -->
        <div id="canvas-container">
            <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
        </div>
    </div>

    <script>
        // On-screen debug logger for mobile troubleshooting
        window.addEventListener('error', function(event) {
            let errDiv = document.getElementById('debug-overlay');
            if (!errDiv) {
                errDiv = document.createElement('div');
                errDiv.id = 'debug-overlay';
                errDiv.style.cssText = 'position:fixed;bottom:0;left:0;width:100%;max-height:50%;background:rgba(255,0,0,0.85);color:white;padding:10px;font-size:12px;overflow:auto;z-index:99999;word-break:break-all;';
                document.body.appendChild(errDiv);
            }
            errDiv.innerHTML += `<br>[Error] ${event.message} (${event.filename}:${event.lineno})<br>`;
        });

        const RenPyPlayer = {
            extractedFiles: {},
            
            init() {
                const fileInput = document.getElementById('file-input');
                if (!fileInput) {
                    console.error("file-input element not found!");
                    return;
                }
                fileInput.addEventListener('change', (e) => this.handleZipSelect(e));
            },

            async handleZipSelect(event) {
                const file = event.target.files[0];
                if (!file) return;

                this.updateLoaderStatus(`Reading ${file.name}...`);
                
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    
                    this.updateLoaderStatus("Unpacking game files...");
                    const zip = await JSZip.loadAsync(arrayBuffer);
                    
                    this.extractedFiles = {};
                    const filePromises = [];

                    zip.forEach((relativePath, zipEntry) => {
                        if (!zipEntry.dir) {
                            const promise = zipEntry.async('uint8array').then((content) => {
                                this.extractedFiles[relativePath] = content;
                            });
                            filePromises.push(promise);
                        }
                    });

                    await Promise.all(filePromises);
                    
                    this.updateLoaderStatus("Mounting to Virtual File System...");
                    await this.mountToVirtualFS();

                } catch (error) {
                    console.error("Failed to load game zip:", error);
                    alert("Error unpacking zip file. Please ensure it's a valid Ren'Py export.");
                    this.resetUI();
                }
            },

            async mountToVirtualFS() {
                for (const [filePath, data] of Object.entries(this.extractedFiles)) {
                    const targetPath = `/game/${filePath}`;
                    this.ensureDirExists(targetPath);
                    
                    if (typeof FS !== 'undefined') {
                        FS.writeFile(targetPath, data);
                    }
                }

                this.updateLoaderStatus("Starting Ren'Py...");
                
                document.getElementById('loader-screen').style.display = 'none';
                document.getElementById('canvas-container').style.display = 'block';

                if (typeof Module !== 'undefined' && Module.callMain) {
                    Module.callMain(['/game']);
                }
            },

            ensureDirExists(filePath) {
                if (typeof FS === 'undefined') return;
                const parts = filePath.split('/').slice(0, -1);
                let currentPath = '';
                for (const part of parts) {
                    if (!part) continue;
                    currentPath += '/' + part;
                    try {
                        FS.mkdir(currentPath);
                    } catch (e) {
                        // Directory already exists
                    }
                }
            },

            updateLoaderStatus(message) {
                const statusElem = document.querySelector('#loader-screen p');
                if (statusElem) statusElem.textContent = message;
            },

            resetUI() {
                document.getElementById('loader-screen').style.display = 'flex';
                document.getElementById('canvas-container').style.display = 'none';
                this.updateLoaderStatus("Select a compiled PC game zip archive (.zip) to load and play directly in your browser.");
            }
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => RenPyPlayer.init());
        } else {
            RenPyPlayer.init();
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker registered!', reg))
                    .catch((err) => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
